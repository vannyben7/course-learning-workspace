services:
  course-learning-workspace:
    build:
      context: .
    ports:
      - "${CLW_BIND_IP:-127.0.0.1}:${CLW_HOST_PORT:-8780}:8780"
    environment:
      CLW_HOST: 0.0.0.0
      CLW_PORT: 8780
      CLW_ALLOW_NETWORK: ${CLW_ALLOW_NETWORK:-0}
      CLW_DATA_DIR: /data
      NOTEBOOKLM_HOME: /data/notebooklm
      NOTEBOOKLM_AUTH_JSON: ${NOTEBOOKLM_AUTH_JSON:-}
      CLW_ASSISTANT_PROVIDER: ${CLW_ASSISTANT_PROVIDER:-local}
      CLW_ASSISTANT_MODEL: ${CLW_ASSISTANT_MODEL:-}
      CLW_ASSISTANT_BASE_URL: ${CLW_ASSISTANT_BASE_URL:-}
      CLW_ASSISTANT_API_KEY: ${CLW_ASSISTANT_API_KEY:-}
      CLW_DEEPSEEK_API_KEY: ${CLW_DEEPSEEK_API_KEY:-}
      CLW_DEEPSEEK_MODEL: ${CLW_DEEPSEEK_MODEL:-deepseek-v4-flash}
      CLW_DEEPSEEK_BASE_URL: ${CLW_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      CLW_OPENAI_API_KEY: ${CLW_OPENAI_API_KEY:-}
      CLW_OPENAI_MODEL: ${CLW_OPENAI_MODEL:-gpt-5.2}
      CLW_OPENAI_BASE_URL: ${CLW_OPENAI_BASE_URL:-https://api.openai.com/v1}
      CLW_GEMINI_API_KEY: ${CLW_GEMINI_API_KEY:-}
      CLW_GEMINI_MODEL: ${CLW_GEMINI_MODEL:-gemini-2.5-flash}
      CLW_GEMINI_BASE_URL: ${CLW_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      CLW_OPENROUTER_API_KEY: ${CLW_OPENROUTER_API_KEY:-}
      CLW_OPENROUTER_MODEL: ${CLW_OPENROUTER_MODEL:-openai/gpt-5.2}
      CLW_OPENROUTER_BASE_URL: ${CLW_OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      CLW_KIMI_API_KEY: ${CLW_KIMI_API_KEY:-}
      CLW_KIMI_MODEL: ${CLW_KIMI_MODEL:-kimi-k2.6}
      CLW_KIMI_BASE_URL: ${CLW_KIMI_BASE_URL:-https://api.moonshot.ai/v1}
      CLW_CUSTOM_API_KEY: ${CLW_CUSTOM_API_KEY:-}
      CLW_CUSTOM_MODEL: ${CLW_CUSTOM_MODEL:-}
      CLW_CUSTOM_BASE_URL: ${CLW_CUSTOM_BASE_URL:-}
      CLW_WEB_SEARCH_ENABLED: ${CLW_WEB_SEARCH_ENABLED:-0}
    volumes:
      - ./data:/data
      # Browser uploads are copied into this local course data folder.
